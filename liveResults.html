<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMMC Live Results</title>
<link rel="stylesheet" href="theme.css">
<style>
  .wrap{max-width:900px;margin:0 auto;padding:16px}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{padding:7px 8px;text-align:center;border-bottom:1px solid rgba(255,255,255,.08);white-space:nowrap}
  .l{text-align:left}
  tr.me td{background:rgba(255,255,255,.12);font-weight:700}
  .adj{font-size:11px;color:var(--glow);margin-left:4px}
  .muted{color:var(--foam-dim);font-size:12px;margin:8px 0}
  .picks,.pills{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  .pill{display:inline-flex;align-items:baseline;gap:6px;padding:8px 16px;border-radius:999px;
        background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);font-size:20px;font-weight:700}
  .pill small{font-size:11px;font-weight:500;color:var(--foam-dim)}
</style>
</head>
<body>
<div class="wrap">
  <h2 id="title">Live results</h2>
  <div id="pills" class="pills"></div>
  <div id="picks" class="picks"></div>
  <div id="table" style="overflow-x:auto"></div>
  <div id="status" class="muted"></div>
</div>
<script>
// Public page: no login needed. Pills only appear when a signed-in member is also a competitor in the event.
const CAL_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxh7FmiPU34XJy6hnP-uR3AMfEuApD0fqBDs9fXnkRPYFKgQ-6gv8hapY1aOdeuLuO6ZA/exec";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const me = (() => { try { return String((JSON.parse(localStorage.getItem("SMMC_USER") || "null") || {}).name || "").trim().toLowerCase(); } catch (e) { return ""; } })();
let key = new URLSearchParams(location.search).get("event");
const api = q => fetch(CAL_WEBAPP_URL + "?action=liveData" + q).then(r => r.json());
const adjTxt = a => a > 0 ? "+" + a : a < 0 ? String(a) : "";
const ord = i => { const j = i % 10, k = i % 100; return i + (j === 1 && k !== 11 ? "st" : j === 2 && k !== 12 ? "nd" : j === 3 && k !== 13 ? "rd" : "th"); };
const isMe = r => me && String(r.member).trim().toLowerCase() === me;

function draw(v, updated) {
  $("title").textContent = v.title + (v.date ? " – " + v.date : "");
  const n = v.races, hc = v.handicaps, mine = v.rows.find(isMe);

  $("pills").innerHTML = !mine ? "" :
    `<span class="pill"><small>Position</small>${mine.pos ? ord(mine.pos) : "–"}<small>of ${v.rows.length}</small></span>` +
    (hc ? `<span class="pill"><small>${v.status === "sent" ? "Final handicap" : "Current handicap"}</small>${mine.hcap}` +
          (mine.adj ? `<span class="adj">${adjTxt(mine.adj)}</span>` : "") + `</span>` : "");

  const h = `<th>Pos</th><th class="l">Sail</th><th class="l">Name</th>` + (n ? `<th>Net</th>` : "") +
            Array.from({ length: n }, (_, i) => `<th>R${i + 1}</th>`).join("") +
            (hc ? `<th>${v.status === "sent" ? "Final hcap" : "Next hcap"}</th>` : "");
  const rows = v.rows.map(r => `<tr class="${isMe(r) ? "me" : ""}">
    <td>${r.pos ?? ""}</td><td class="l">${esc(r.sail)}</td><td class="l">${esc(r.member)}</td>
    ${n ? `<td>${r.net}</td>` : ""}${r.scores.map(s => `<td>${s ?? "–"}</td>`).join("")}
    ${hc ? `<td>${r.hcap}<span class="adj">${adjTxt(r.adj)}</span></td>` : ""}</tr>`).join("");
  $("table").innerHTML = `<table><thead><tr>${h}</tr></thead><tbody>${rows}</tbody></table>`;
  $("status").textContent = (v.status === "sent" ? "Final – results sent. " : n ? `After ${n} race${n > 1 ? "s" : ""}. ` : "Not started. ") +
    (updated ? "Updated " + new Date(Number(updated)).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) + "." : "");
}

async function load() {
  try {
    if (!key) {
      const { events } = await api("");
      if (events.length !== 1) {
        $("table").innerHTML = ""; $("pills").innerHTML = "";
        $("picks").innerHTML = events.map(e => `<button class="btn btn-ghost" data-k="${esc(e.hexKey)}">${esc(e.title)}</button>`).join("");
        $("status").textContent = events.length ? "Choose an event." : "No races are in progress right now.";
        return;
      }
      key = events[0].hexKey;
    }
    const r = await api("&event=" + encodeURIComponent(key));
    if (!r.found) { key = null; $("status").textContent = "That event is not in progress."; return; }
    $("picks").innerHTML = "";
    draw(r.view, r.updated);
  } catch (e) { $("status").textContent = "Could not load live results."; console.error(e); }
}

$("picks").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (b) { key = b.dataset.k; load(); } });
load();
setInterval(load, 20000);
</script>
</body>
</html>
