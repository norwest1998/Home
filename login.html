<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<link rel="stylesheet" href="theme.css">
<style>
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; margin:0; }
  .login-card { width:100%; max-width:380px; padding:28px; border-radius:12px;
                background:var(--ocean-mid, #12304a); border:1px solid var(--glass-border, rgba(255,255,255,.15)); }
  .login-card h2 { margin:0 0 4px; }
  .login-card p.sub { margin:0 0 20px; font-size:13px; opacity:.7; }
  .login-card input { width:100%; box-sizing:border-box; padding:10px 12px; margin:6px 0 10px; border-radius:6px;
                      border:1px solid var(--glass-border, rgba(255,255,255,.2)); background:transparent; color:inherit; font-size:14px; }
  .login-card button.go { width:100%; padding:10px; border-radius:6px; border:0; cursor:pointer; font-size:14px; font-weight:600; }
  .divider { text-align:center; font-size:12px; opacity:.5; margin:16px 0; }
  #err { color:#ff6b6b; font-size:13px; min-height:18px; margin-top:10px; }

  #msg, #chMsg, #regMsg, #setupMsg { font-size:13px; opacity:.8; margin-bottom:8px; }
  a.alt { display:block; text-align:center; font-size:12px; margin-top:10px; opacity:.75; color:inherit; }
  #busy { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
          gap:12px; background:rgba(5,15,25,.78); z-index:1000; color:#fff; text-align:center; }
  #busy.on { display:flex; }
  #busy .spin { width:42px; height:42px; border:4px solid rgba(255,255,255,.25); border-top-color:#fff;
               border-radius:50%; animation:sp .8s linear infinite; }
  #busyMsg { font-size:15px; font-weight:600; }
  #busy small { font-size:12px; opacity:.7; }
  @keyframes sp { to { transform:rotate(360deg); } }
  #googleBtn { display:flex; justify-content:center; min-height:44px; }
</style>
</head>
<body>
<div class="login-card">
  <h2>Sign in</h2>
  <p class="sub">Use the email address registered with the club.</p>

  <div id="googleBtn"></div>
  <div class="divider">or sign in with an emailed code</div>

  <div id="stepEmail">
    <input id="em" type="email" placeholder="Email address" autocomplete="email">
    <button class="go btn" id="sendBtn">Email me a code</button>
  </div>
  <div id="stepCode" style="display:none;">
    <div id="msg"></div>
    <input id="cd" inputmode="numeric" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code">
    <button class="go btn" id="checkBtn">Sign in</button>
  </div>
  <div class="divider">or sign in with a password</div>
  <div id="stepPwd">
    <input id="uid" placeholder="User ID / email" autocomplete="username">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <button class="go btn" id="pwBtn">Sign in</button>
    <a href="#" id="regLink" class="alt">Register / forgot password?</a>
  </div>
  <div id="stepReg" style="display:none;">
    <div id="regMsg">Enter your registered email. We'll send a link to set your password.</div>
    <input id="rem" type="email" placeholder="Email address" autocomplete="email">
    <button class="go btn" id="regBtn">Email me a link</button>
    <a href="#" id="regBack" class="alt">Back to sign in</a>
  </div>
  <div id="stepSetup" style="display:none;">
    <div id="setupMsg"></div>
    <input id="sp" type="password" placeholder="New password (10+ characters)" autocomplete="new-password">
    <input id="sp2" type="password" placeholder="Confirm new password" autocomplete="new-password">
    <button class="go btn" id="setBtn">Set password &amp; sign in</button>
  </div>
  <div id="stepChange" style="display:none;">
    <div id="chMsg">You must set a new password.</div>
    <input id="np" type="password" placeholder="New password (10+ characters)" autocomplete="new-password">
    <input id="np2" type="password" placeholder="Confirm new password" autocomplete="new-password">
    <button class="go btn" id="chBtn">Save password</button>
  </div>
  <div id="err"></div>
</div>
<div id="busy"><div class="spin"></div><div id="busyMsg"></div><small>This can take a few seconds</small></div>

<script src="shared.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
// >>> Paste the FULL client ID from Google Cloud Console (must end in .apps.googleusercontent.com)
const GOOGLE_CLIENT_ID = "738246015685-4vk2o2l7nit598jvkl8r423sa4hff8rf.apps.googleusercontent.com";

const $ = id => document.getElementById(id);
const setErr = m => { $("err").textContent = m || ""; };
const NEXT  = new URLSearchParams(location.search).get("next") || "";
const SETUP = new URLSearchParams(location.search).get("setup");
let leaving = false;
async function busy(msg, fn) {
  setErr(""); $("busyMsg").textContent = msg; $("busy").classList.add("on");
  try { await fn(); } catch (e) { setErr(e.message); }
  finally { if (!leaving) $("busy").classList.remove("on"); }   // stays up until the redirect
}
function showOnly(id) {
  ["googleBtn","stepEmail","stepCode","stepPwd","stepChange","stepReg","stepSetup"]
    .forEach(i => $(i).style.display = i === id ? "block" : "none");
  document.querySelectorAll(".divider").forEach(d => d.style.display = "none");
}

function finish(d) {
  leaving = true;
  localStorage.setItem(TOKEN_KEY, d.token);
  localStorage.setItem("SMMC_USER", JSON.stringify({ email: d.email, name: d.name, role: d.role, exp: d.exp, sid: d.sid }));
  const n = d.next || NEXT;
  location.replace(n.startsWith("/") && !n.startsWith("//") ? n : "admin.html");
}

// --- Google ---
async function onGoogle(resp) {
  busy("Signing you in with Google…", async () => finish(await gw({ action: "login", idToken: resp.credential, userAgent: navigator.userAgent })));
}

window.addEventListener("load", () => {
  if (GOOGLE_CLIENT_ID.startsWith("PASTE_")) { setErr("Set GOOGLE_CLIENT_ID in login.html"); return; }
  const t = setInterval(() => {
    if (!window.google || !google.accounts) return;
    clearInterval(t);
    google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onGoogle });
    google.accounts.id.renderButton($("googleBtn"), { theme: "outline", size: "large", text: "signin_with", width: 320 });
  }, 150);
});

// --- Emailed code ---
let pendingPwd = "";
$("pwBtn").addEventListener("click", () => busy("Signing you in…", async () => {
  const d = await gw({ action: "passwordLogin", userId: $("uid").value.trim(), password: $("pw").value, userAgent: navigator.userAgent });
  if (!d.mustChange) return finish(d);
  localStorage.setItem(TOKEN_KEY, d.token);
  pendingPwd = $("pw").value;
  showOnly("stepChange");
}));
$("chBtn").addEventListener("click", () => busy("Saving password…", async () => {
  if ($("np").value !== $("np2").value) throw new Error("Passwords do not match.");
  finish(await gw({ action: "changePassword", oldPassword: pendingPwd, newPassword: $("np").value }));
  pendingPwd = "";
}));
$("sendBtn").addEventListener("click", () => busy("Sending code…", async () => {
  const email = $("em").value.trim();
  if (!email) throw new Error("Enter your email address.");
  await gw({ action: "requestCode", email, userAgent: navigator.userAgent });
  $("stepEmail").style.display = "none";
  $("stepCode").style.display = "block";
  $("msg").textContent = "If that email is registered, a code was sent. It expires in 10 minutes.";
  $("cd").focus();
}));
$("checkBtn").addEventListener("click", () => busy("Verifying code…", async () =>
  finish(await gw({ action: "verifyCode", email: $("em").value.trim(), code: $("cd").value.trim(), userAgent: navigator.userAgent }))));
$("cd").addEventListener("keydown", e => { if (e.key === "Enter") $("checkBtn").click(); });
$("em").addEventListener("keydown", e => { if (e.key === "Enter") $("sendBtn").click(); });

// --- Register / forgot password ---
$("regLink").addEventListener("click", e => { e.preventDefault(); setErr(""); $("rem").value = $("uid").value.trim(); showOnly("stepReg"); });
$("regBack").addEventListener("click", e => { e.preventDefault(); location.href = "login.html" + (NEXT ? "?next=" + encodeURIComponent(NEXT) : ""); });
$("regBtn").addEventListener("click", () => busy("Sending link…", async () => {
  const email = $("rem").value.trim();
  if (!email) throw new Error("Enter your email address.");
  await gw({ action: "requestRegister", email, next: NEXT });
  $("regMsg").textContent = "If that email is registered, a link was sent. It expires in 30 minutes.";
  $("rem").style.display = $("regBtn").style.display = "none";
}));
$("setBtn").addEventListener("click", () => busy("Saving password…", async () => {
  if ($("sp").value.length < 10) throw new Error("Password must be at least 10 characters.");
  if ($("sp").value !== $("sp2").value) throw new Error("Passwords do not match.");
  finish(await gw({ action: "completeRegister", setup: SETUP, newPassword: $("sp").value }));
}));
if (SETUP) busy("Checking your link…", async () => {
  try {
    const d = await gw({ action: "validateSetup", setup: SETUP });
    $("setupMsg").textContent = "Set a password for " + d.email + ".";
    showOnly("stepSetup");
  } catch (e) { showOnly("stepReg"); throw e; }       // expired: offer a new link
});
</script>
</body>
</html>
