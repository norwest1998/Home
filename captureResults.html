<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>SMMC Race Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =================== THEME.CSS (club design system) =================== */
/* =================================================================
   THEME.CSS — shared design system for SMMC pages (index.html, admin.html)
   Design tokens, glass/panel primitives, nav, buttons, badges, tabs,
   search, filter buttons, member/app drawers & lists, tile-grid, tag, footer.
   Page-specific layout (hero, results, weather, calendar, etc.) stays
   in each page's own <style> block.
   ================================================================= */

  /* =========================================================
     DESIGN TOKENS — change these to re-skin every page at once
     ========================================================= */
  :root{     
    --ocean-deep:   #071b2c;
    --ocean-mid:    #0f3550;
    --sea-teal:     #164a56;
    --foam:         #eaf6f6;
    --foam-dim:     rgba(234,246,246,0.62);
    --signal:       #ff6a3d;   /* regatta / logo accent */
    --glow:         #5eead4;   /* wake / bioluminescent accent */
    --whatsapp:     #1a8139;

    --glass-fill:   rgba(255,255,255,0.06);
    --glass-fill-hi:rgba(255,255,255,0.11);
    --glass-border: rgba(255,255,255,0.16);
    --glass-blur:   18px;

    --font-display: 'Inter', sans-serif;
    --font-body:    'Inter', sans-serif;
    --font-data:    'Inter', sans-serif;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html{ scroll-behavior:smooth; }

  body{
    font-family:var(--font-body);
    color:var(--foam);
    min-height:100vh;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(94,234,212,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(255,106,61,0.08), transparent 55%),
      linear-gradient(180deg, var(--ocean-deep) 0%, var(--ocean-mid) 55%, var(--sea-teal) 100%);
    overflow-x:hidden;
    position:relative;
  }

  /* Subtle moving caustic light — water without a hero photo */
  body::before{
    content:"";
    position:fixed; inset:-20%;
    background:
      repeating-linear-gradient(115deg,
        rgba(255,255,255,0.025) 0px,
        rgba(255,255,255,0.025) 2px,
        transparent 2px,
        transparent 140px);
    animation:drift 22s linear infinite;
    pointer-events:none;
    z-index:0;
  }
  @keyframes drift{
    0%{ transform:translate(0,0); }
    100%{ transform:translate(-140px,80px); }
  }

  /* =========================================================
     GLASS PRIMITIVE — the one reusable surface every card uses
     ========================================================= */
  .glass{
    background:linear-gradient(155deg, var(--glass-fill-hi), var(--glass-fill));
    border:1px solid var(--glass-border);
    border-radius:20px;
    -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(140%);
    backdrop-filter:blur(var(--glass-blur)) saturate(140%);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.25) inset,
      0 -1px 12px rgba(255,255,255,0.03) inset,
      0 18px 40px rgba(2,10,18,0.35);
    position:relative;
  }
  .glass::after{
    content:"";
    position:absolute; inset:0;
    border-radius:inherit;
    background:linear-gradient(120deg, rgba(255,255,255,0.14) 0%, transparent 30%);
    pointer-events:none;
  }
  .nav-icon {
    width: 35px;
    height: 35px;
  }

  /* =========================================================
     NAV & DROPDOWNS
     ========================================================= */
  .nav-glass{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    gap:16px;
    padding:14px 28px;
    margin:0;
    border-radius:0;
    border-left:none; border-right:none; border-top:none;
    -webkit-backdrop-filter:blur(20px) saturate(150%);
    backdrop-filter:blur(20px) saturate(150%);
    background:rgba(7,27,44,0.75);
    border-bottom:1px solid var(--glass-border);
  }
  .nav-glass::after{ display:none; }

  .brand{ display:flex; align-items:center; gap:12px; text-decoration:none; }
  .logo{ width:38px; height:38px; flex:none; border-radius:20%; object-fit:cover; border:1px solid var(--glass-border); }

  .brand-text{ display:flex; flex-direction:column; line-height:1.05; }
  .brand-text strong{
    font-family:var(--font-display); font-size:17px; letter-spacing:0.01em; color:var(--foam);
  }
  .brand-text span{
    font-family:var(--font-data); font-size:10.5px; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--glow);
  }

  .nav-links{ display:flex; gap:8px; align-items:center; list-style:none; }
  .nav-item{ position:relative; }
  .nav-link{
    font-family:var(--font-body); font-size:13.5px; font-weight:500;
    color:var(--foam-dim); text-decoration:none;
    padding:8px 14px; border-radius:10px;
    display:inline-flex; align-items:center; gap:6px;
    transition:background 0.2s ease, color 0.2s ease;
    cursor:pointer;
  }
  .nav-link:hover, .nav-item:hover > .nav-link{
    background:var(--glass-fill-hi); color:var(--foam);
  }
  
  /* Dropdown Menu styling */
  .dropdown-menu{
    position:absolute; top:100%; left:0;
    min-width:200px;
    padding:8px;
    padding-top:14px;   /* visual gap, still inside the hoverable box */
    margin-top:-6px;    /* pulls the box up so it touches .nav-link, no dead zone */
    display:flex; flex-direction:column; gap:4px;
    list-style:none;
    opacity:0; transform:translateY(8px); pointer-events:none;
    transition:opacity 0.2s ease, transform 0.2s ease;
    z-index:60;
  }
  .nav-item:hover .dropdown-menu,
  .nav-item:focus-within .dropdown-menu{
    opacity:1; transform:translateY(0); pointer-events:auto;
  }
  .dropdown-menu a{
    font-family:var(--font-body); font-size:13px; font-weight:500;
    color:var(--foam-dim); text-decoration:none;
    padding:8px 12px; border-radius:8px;
    display:block;
    transition:background 0.15s ease, color 0.15s ease;
  }
  .dropdown-menu a:hover{
    background:var(--glass-fill-hi); color:var(--glow);
  }

  /* Mobile menu toggle button */
  .nav-toggle{ display:none; background:none; border:none; color:var(--foam); cursor:pointer; }

  @media (max-width:860px){
    .nav-links{ display:none; }
    .nav-toggle{ display:block; }
  }

  .btn{
    font-family:var(--font-body); font-weight:600; font-size:14px;
    padding:12px 22px; border-radius:12px; text-decoration:none;
    display:inline-flex; align-items:center; gap:8px; border:none; cursor:pointer;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover{ transform:translateY(-1px); }
  .btn-primary{
    background:linear-gradient(135deg, var(--glow), #38bfa1);
    color:var(--ocean-deep);
    box-shadow:0 8px 24px rgba(94,234,212,0.25);
  }
  .btn-ghost{
    background:var(--glass-fill); color:var(--foam);
    border:1px solid var(--glass-border);
  }
  .btn-ghost:hover{ background:var(--glass-fill-hi); }

  /* =========================================================
     SECTION HEADERS & CONTAINERS
     ========================================================= */
  .container{ max-width:1180px; margin:0 auto; padding:0 28px; }

  .section-head{
    margin:54px auto 20px;
    display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .section-head h2{
    font-family:var(--font-display); font-size:24px; color:var(--foam); font-weight:600;
    display:flex; align-items:center; gap:10px;
  }
  .section-head p{ font-size:13.5px; color:var(--foam-dim); }

  /* ── Panel shell ── */
  .panel {
    background: linear-gradient(155deg, var(--glass-fill-hi), var(--glass-fill));
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 1px 0 rgba(255,255,255,0.25) inset, 0 18px 40px rgba(2,10,18,0.35);
    overflow: hidden;
  }
 
  .panel-header {
    padding: 20px 24px 0;
    border-bottom: 1px solid var(--glass-border);
  }
 
  .panel-title {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
 
  .panel-title .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--signal);
    box-shadow: 0 0 8px var(--signal);
    animation: pulse 2.4s ease-in-out infinite;
    flex-shrink: 0;
  }
 
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }
 
  .panel-title h3 {
    font-size: 18px; font-weight: 600; color: var(--foam);
  }
 
  /* ── Tabs ── */
  .tab-row {
    display: flex;
    gap: 4px;
  }
 
  .tab {
    font-family: var(--font-data);
    font-size: 12px;
    letter-spacing: 0.04em;
    padding: 8px 16px;
    border-radius: 8px 8px 0 0;
    cursor: pointer;
    background: transparent;
    border: 1px solid transparent;
    border-bottom: none;
    color: var(--foam-dim);
    transition: background 0.15s, color 0.15s;
    position: relative;
    bottom: -1px;
  }
 
  .tab:hover { color: var(--foam); background: var(--glass-fill); }
 
  .tab.active {
    background: var(--glass-fill-hi);
    border-color: var(--glass-border);
    border-bottom-color: transparent;
    color: var(--glow);
  }

  .tab-row-wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .add-app-pill {
    display: none;
    align-items: center;
    gap: 6px;
    font-family: var(--font-data);
    font-size: 11px;
    letter-spacing: 0.04em;
    padding: 6px 14px;
    margin-bottom: 8px;
    border-radius: 999px;
    cursor: pointer;
    background: var(--glass-fill);
    border: 1px solid var(--glow);
    color: var(--glow);
    white-space: nowrap;
    transition: background 0.15s, color 0.15s;
  }

  .add-app-pill.visible { display: inline-flex; }

  .add-app-pill:hover {
    background: var(--glow);
    color: var(--ocean-deep);
  }

  /* ── Tab content ── */
  .tab-content { display: none; padding: 20px 24px 24px; }
  .tab-content.active { display: block; }

  /* ── Search bar ── */
  .search-wrap {
    position: relative;
    margin-bottom: 16px;
  }
 
  .search-icon {
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    color: var(--foam-dim);
    pointer-events: none;
  }
 
  .search-input {
    width: 100%;
    font-family: var(--font-body);
    font-size: 13.5px;
    padding: 10px 14px 10px 36px;
    border-radius: 10px;
    background: var(--glass-fill);
    border: 1px solid var(--glass-border);
    color: var(--foam);
    outline: none;
    transition: border-color 0.2s;
  }
 
  .search-input::placeholder { color: var(--foam-dim); }
  .search-input:focus { border-color: rgba(94,234,212,0.45); }

  .member-filter-btn {
    font-family: var(--font-data);
    font-size: 11px;
    letter-spacing: 0.04em;
    padding: 5px 12px;
    border-radius: 8px;
    cursor: pointer;
    background: var(--glass-fill);
    border: 1px solid var(--glass-border);
    color: var(--foam-dim);
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }

.member-filter-btn:hover { color: var(--foam); background: var(--glass-fill-hi); }
.member-filter-btn.active { background: var(--glass-fill-hi); border-color: var(--glow); color: var(--glow); }
  .member-filter-select {
    font-family: var(--font-data);
    font-size: 11px;
    letter-spacing: 0.04em;
    padding: 5px 12px;
    border-radius: 8px;
    cursor: pointer;
    background: var(--glass-fill);
    border: 1px solid var(--glass-border);
    color: var(--foam-dim);
    outline: none;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    appearance: none;
    -webkit-appearance: none;
  }
  .member-filter-select:focus,
  .member-filter-select.active {
    background: var(--glass-fill-hi);
    border-color: var(--glow);
    color: var(--glow);
  }
  .member-filter-select option {
    background: var(--ocean-mid);
    color: var(--foam);
  }

  .badge {
    display: inline-block;
    font-family: var(--font-data);
    font-size: 10px;
    letter-spacing: 0.06em;
    padding: 3px 8px;
    border-radius: 6px;
    white-space: nowrap;
  }
 
  .badge-full     { background: rgba(94,234,212,0.15);  border: 1px solid rgba(94,234,212,0.35);  color: var(--glow); }
  .badge-expired   { background: rgba(255,106,61,0.12);  border: 1px solid rgba(255,106,61,0.3);   color: var(--signal); }
  .badge-affiliate   { background: rgba(96,165,250,0.12);  border: 1px solid rgba(96,165,250,0.3);   color: #93c5fd; }
  .badge-admin     { background: rgba(90, 89, 88, 0.12); border: 1px solid rgba(255,209,102,0.3);  color: #63532d; }
  .badge-default  { background: var(--glass-fill);      border: 1px solid var(--glass-border);    color: var(--foam-dim); }

  /* ── Member detail drawer ── */
  .drawer-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(7,27,44,0.65);
    backdrop-filter: blur(4px);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
 
  .drawer-overlay.open { display: flex; }
 
  .drawer {
    background: linear-gradient(155deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06));
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    backdrop-filter: blur(24px) saturate(150%);
    -webkit-backdrop-filter: blur(24px) saturate(150%);
    box-shadow: 0 32px 64px rgba(2,10,18,0.55);
    width: 100%;
    max-width: 480px;
    max-height: 90vh;
    overflow-y: auto;
  }
 
  .drawer-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--glass-border);
  }
 
  .drawer-header h4 {
    font-size: 16px;
    font-weight: 600;
    color: var(--foam);
  }
 
  .drawer-close {
    background: var(--glass-fill);
    border: 1px solid var(--glass-border);
    border-radius: 8px;
    color: var(--foam-dim);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 4px 8px;
    transition: background 0.15s, color 0.15s;
  }
 
  .drawer-close:hover { background: var(--glass-fill-hi); color: var(--foam); }
 
  .drawer-body { padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 14px; }
 
  .drawer-avatar {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--glow), #38bfa1);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700;
    color: var(--ocean-deep);
    flex-shrink: 0;
  }
 
  .drawer-name-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 4px;
  }
 
  .drawer-name-col { display: flex; flex-direction: column; gap: 4px; }
  .drawer-name { font-size: 20px; font-weight: 700; color: var(--foam); }
 
  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
 
  .detail-item {
    background: var(--glass-fill);
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
 
  .detail-item.full-width { grid-column: 1 / -1; }
 
  .detail-label {
    font-family: var(--font-data);
    font-size: 9.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--foam-dim);
  }
 
  .detail-value {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--foam);
  }
 

  /* ── Applications tab ── */
  .app-filters {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
 
  .app-filter-btn {
    font-family: var(--font-data);
    font-size: 11px;
    letter-spacing: 0.04em;
    padding: 5px 12px;
    border-radius: 8px;
    cursor: pointer;
    background: var(--glass-fill);
    border: 1px solid var(--glass-border);
    color: var(--foam-dim);
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
 
  .app-filter-btn:hover { color: var(--foam); background: var(--glass-fill-hi); }
 
  .app-filter-btn.active {
    background: var(--glass-fill-hi);
    border-color: var(--glow);
    color: var(--glow);
  }
 
  .app-list { display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow-y: auto; }
  .app-list::-webkit-scrollbar { width: 6px; }
  .app-list::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }
 
  .app-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: var(--glass-fill);
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.12s;
  }
 
  .app-row:hover {
    background: var(--glass-fill-hi);
    border-color: rgba(94,234,212,0.3);
    transform: translateX(2px);
  }
 
  .app-name { font-weight: 600; font-size: 14px; color: var(--foam); }
  .app-meta { font-size: 11.5px; color: var(--foam-dim); margin-top: 2px; }
 
  .app-status {
    display: inline-block;
    font-family: var(--font-data);
    font-size: 10px;
    letter-spacing: 0.05em;
    padding: 4px 9px;
    border-radius: 6px;
    white-space: nowrap;
  }
 
  .status-received  { background: rgba(96,165,250,0.15);  border: 1px solid rgba(96,165,250,0.35);  color: #93c5fd; }
  .status-progress  { background: rgba(245,158,11,0.15);  border: 1px solid rgba(245,158,11,0.35);  color: #fbbf24; }
  .status-awaiting  { background: rgba(255,106,61,0.15);  border: 1px solid rgba(255,106,61,0.35);  color: var(--signal); }
  .status-processed { background: rgba(94,234,212,0.15);  border: 1px solid rgba(94,234,212,0.35);  color: var(--glow); }
 
  .app-chevron { color: var(--foam-dim); font-size: 16px; }
 
  /* Application detail placeholder drawer */
  .app-drawer-placeholder {
    padding: 32px 24px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
 
  .app-drawer-placeholder .placeholder-icon {
    font-size: 36px;
    opacity: 0.5;
  }
 
  .app-drawer-placeholder p {
    font-size: 13px;
    color: var(--foam-dim);
    max-width: 280px;
    line-height: 1.5;
  }
 
  .app-drawer-placeholder .app-id-chip {
    font-family: var(--font-data);
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 8px;
    background: var(--glass-fill);
    border: 1px solid var(--glass-border);
    color: var(--glow);
  }
 
  /* Empty states */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--foam-dim);
    font-size: 13px;
  }
 
  /* Loading spinner */
  .spinner {
    width: 20px; height: 20px;
    border: 2px solid var(--glass-border);
    border-top-color: var(--glow);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 8px;
  }

  .tile-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    margin-top: 16px;
  }

  @media (max-width: 680px) { .tile-grid { grid-template-columns: 1fr; } }

  .tile {
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .tile-title {
    display: flex;
    align-items: center; /* Vertically aligns icon and text center-to-center */
    gap: 12px;           /* Controls horizontal space between icon and text */
  }

  .tile-icon {
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
  }

  .tag {
    display: inline-block;
    font-family: var(--font-data);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 6px;
    background: var(--glass-fill);
    border: 1px solid var(--glass-border);
    color: var(--foam-dim);
    width: fit-content;
    margin-top: auto;
  }

  /* ── Application detail sections ── */
  .app-detail-section {
    background: var(--glass-fill); border: 1px solid var(--glass-border);
    border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px;
  }
 
  .app-detail-section-title {
    font-family: var(--font-data); font-size: 10px;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--glow); padding-bottom: 8px;
    border-bottom: 1px solid var(--glass-border);
  }
 
  .app-detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .app-detail-grid .full-width { grid-column: 1 / -1; }
 
  .app-detail-item { display: flex; flex-direction: column; gap: 3px; }
 
  .app-detail-label {
    font-family: var(--font-data); font-size: 9.5px;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--foam-dim);

// Entries lock the instant the first race exists — not before.
function entriesLocked(){ return state.races.length > 0; }

const STORE_PREFIX = 'smmc-race-';

function storageKey(eventId){ return STORE_PREFIX + eventId; }

function saveState(){
  if(!state.event) return;
  try{
    const payload = {
      event: state.event,
      entries: state.entries,
      races: state.races,
      reportText: state.reportText
    };
    localStorage.setItem(storageKey(state.event.id), JSON.stringify(payload));
  }catch(e){ console.error('save failed', e); }
}

function loadState(eventId){
  try{
    const raw = localStorage.getItem(storageKey(eventId));
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}

function hasSavedProgress(eventId){
  try{ return !!localStorage.getItem(storageKey(eventId)); }catch(e){ return false; }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> t.classList.remove('show'), 2200);
}

/* ============ SCORING ENGINE ============ */
function dropsForRaceCount(n){
  if(n < 4) return 0;
  let drops = 1;
  let threshold = 8;
  while(n >= threshold){ drops++; threshold += 8; }
  return drops;
}

function computeStandings(entries, races){
  const n = entries.length;
  const results = entries.map(e => {
    const raceScores = races.map(r => {
      if(r.raceRO && r.raceRO === e.sailNo) return { race: r.raceNumber, points: null, code: 'RO' };
      const posIdx = r.positions.indexOf(e.sailNo);
      if(posIdx >= 0) return { race: r.raceNumber, points: posIdx+1, code: null };
      if(r.dns.includes(e.sailNo)) return { race: r.raceNumber, points: n+1, code: 'DNS' };
      if(r.dnf.includes(e.sailNo)) return { race: r.raceNumber, points: n+1, code: 'DNF' };
      return { race: r.raceNumber, points: null, code: 'BYE' };
    });
    const counted = raceScores.filter(rs => rs.points !== null);
    const totalRaces = counted.length;
    const drops = dropsForRaceCount(totalRaces);
    const sortedDesc = [...counted].sort((a,b) => b.points - a.points);
    const discardSet = new Set();
    for(let i=0;i<drops && i<sortedDesc.length;i++) discardSet.add(sortedDesc[i]);
    const net = counted.reduce((sum, rs) => discardSet.has(rs) ? sum : sum + rs.points, 0);
    const total = counted.reduce((sum, rs) => sum + rs.points, 0);
    return { sailNo: e.sailNo, member: e.member, raceScores, discardSet, net, total, drops };
  });

  function tieBreak(a, b){
    const ap = a.raceScores.filter(r=>r.points!==null).map(r=>r.points).sort((x,y)=>x-y);
    const bp = b.raceScores.filter(r=>r.points!==null).map(r=>r.points).sort((x,y)=>x-y);
    const len = Math.max(ap.length, bp.length);
    for(let i=0;i<len;i++){
      const av = ap[i] ?? Infinity, bv = bp[i] ?? Infinity;
      if(av !== bv) return av - bv;
    }
    const aLast = [...a.raceScores].reverse().find(r=>r.points!==null);
    const bLast = [...b.raceScores].reverse().find(r=>r.points!==null);
    const av2 = aLast ? aLast.points : Infinity, bv2 = bLast ? bLast.points : Infinity;
    return av2 - bv2;
  }

  results.sort((a,b) => (a.net - b.net) || tieBreak(a,b));
  results.forEach((r,i) => r.pos = i+1);
  return results;
}

function currentStandingsOrder(){
  // returns sail numbers ordered by current standing (best first); before any race, by sail number asc
  if(state.races.length === 0){
    return [...state.entries].sort((a,b)=> Number(a.sailNo)-Number(b.sailNo)).map(e=>e.sailNo);
  }
  const standings = computeStandings(state.entries, state.races);
  return standings.map(s=>s.sailNo);
}

function headerHTML(){
  const ev = state.event;
  let sub = '';
  if(ev){
    const dt = parseDMY(ev.date);
    const dateStr = `${DOW[dt.getDay()]} ${dt.getDate()} ${MON[dt.getMonth()]} ${dt.getFullYear()}`;
    sub = `<div class="subheader">
      <span class="badge badge-default"><span class="class-roundel">${CLASS_ABBR[ev.class]||ev.class.slice(0,3)}</span>${escapeHTML(ev.regattaName)}</span>
      <span class="badge badge-default">${dateStr}</span>
      <span class="badge badge-default">${ev.start}–${ev.end}</span>
      ${ev.round ? `<span class="badge badge-brand">Round ${ev.round}</span>` : ''}
    </div>`;
  }
  const showMenu = !!ev;
  return `
  <nav class="nav-glass app-nav">
    ${state.overlay ? `<button class="icon-btn" onclick="closeOverlay()" title="Back">${svgBack()}</button>` : ''}
    <a class="brand" style="cursor:default">
      <img class="logo-img" src="${LOGO_DATA_URI}" alt="SMMC logo">
      <div class="brand-text">
        <strong>Sydney Maritime Modellers Club</strong>
        <span>Race Results</span>
      </div>
    </a>
    <div class="nav-spacer"></div>
    ${showMenu && !state.overlay ? `<button class="icon-btn" onclick="openMenu()">${svgMenu()}</button>` : ''}
    ${sub ? `<div style="width:100%">${sub}</div>` : ''}
  </nav>`;
}

function escapeHTML(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  appEl.innerHTML = headerHTML() + `<div class="app">${body}</div>` + menuHTML() + overlaysHTML() + longPressModalHTML();
  attachDynamicHandlers();
  const navEl = document.querySelector('.app-nav');
  if(navEl) document.documentElement.style.setProperty('--nav-h', navEl.offsetHeight + 'px');
}

/* ---------------- Screen: Event Select ---------------- */
function renderEventSelect(){
  const today = new Date(2026,8,16); // app "today" — Wed 16 Sep 2026
  const q = state.eventSearch.trim().toLowerCase();
  let list = EVENTS.map(e => ({...e, _dt: parseDMY(e.date)}));
  if(q){
    list = list.filter(e =>
      e.class.toLowerCase().includes(q) ||
      e.regattaType.toLowerCase().includes(q) ||
      e.date.includes(q) ||
      (e.round||'').includes(q) ||
      `${e.class} ${e.regattaType}`.toLowerCase().includes(q)
    );
  }
  list.sort((a,b) => a._dt - b._dt);
  // find nearest to today, then window around it
  let startIdx = list.findIndex(e => e._dt >= today);
  if(startIdx === -1) startIdx = Math.max(0, list.length - 20);
  const before = list.slice(Math.max(0,startIdx-6), startIdx).reverse();
  const after = list.slice(startIdx, startIdx+40);
  const ordered = q ? list : [...after, ...before];

  const rows = ordered.map(e => {
    const regattaName = `${e.class} ${e.regattaType}`;
    const saved = hasSavedProgress(e.id);
    let pill = '';
    if(saved){
      const st = loadState(e.id);
      pill = st && st.entriesLocked
        ? `<span class="event-status-pill pill-inprogress">In progress</span>`
        : `<span class="event-status-pill pill-inprogress">Entries set</span>`;
    }
    return `<div class="event-item" data-select-event="${e.id}">
      <div class="event-date-block">
        <div class="dow">${DOW[e._dt.getDay()]}</div>
        <div class="dnum">${e._dt.getDate()}</div>
        <div class="mon">${MON[e._dt.getMonth()]}</div>
      </div>
      <div class="event-main">
        <div class="event-name">${escapeHTML(regattaName)}</div>
        <div class="event-meta">${e.start}–${e.end} · Round ${e.round||'–'} · ${e.season}</div>
      </div>
      ${pill}
    </div>`;
  }).join('');

  return `
    <div class="panel glass panel-pad">
      <div class="section-title">Select a regatta</div>
      <div class="section-hint">Choose the calendar event you're capturing results for. This sets the event ID, date, class and regatta name automatically.</div>
      <input class="search-box" id="eventSearchInput" placeholder="Search by class, round or date…" value="${escapeHTML(state.eventSearch)}">
      <div>${rows || `<div class="empty-note">No matching events.</div>`}</div>
    </div>
  `;
}

/* ---------------- Screen: Competitor Select ---------------- */
function renderCompetitorSelect(){
  const ev = state.event;
  const roster = MEMBERS.filter(m => m.class === ev.class).sort((a,b) => a.member.localeCompare(b.member));
  const allChecked = roster.length > 0 && roster.every(m => state.pendingSelection.has(m.sailNo));

  const rows = roster.map(m => {
    const checked = state.pendingSelection.has(m.sailNo);
    return `<div class="member-row" data-toggle-member="${m.sailNo}">
      <div class="checkbox ${checked?'checked':''}"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div class="member-name">${escapeHTML(m.member)}</div>
      <div class="sail-tag">#${m.sailNo}</div>
    </div>`;
  }).join('');

  const editing = state.entries.length > 0;
  return `
    <div class="panel glass panel-pad">
      <div class="section-title">Regatta entries — ${escapeHTML(ev.class)}</div>
      <div class="section-hint">Active ${escapeHTML(ev.class)} members from the club roster. Tick everyone racing today. Entries stay editable until the first race is captured.</div>
      <div class="select-all-row">
        <span style="font-size:12.5px;color:var(--foam-dim)">${roster.length} active ${escapeHTML(ev.class)} boats</span>
        <button data-select-all="1">${allChecked ? 'Clear all' : 'Select all'}</button>
      </div>
      ${rows || `<div class="empty-note">No active members found for this class.</div>`}
      <div class="count-banner">${state.pendingSelection.size} competitor${state.pendingSelection.size===1?'':'s'} selected</div>
    </div>
    <button class="btn btn-primary btn-block" ${state.pendingSelection.size < 2 ? 'disabled' : ''} data-confirm-entries="1">
      ${editing ? 'Save entries' : 'Confirm entries'}
    </button>
    ${editing ? `<button class="btn btn-ghost btn-block" style="margin-top:10px" data-cancel-edit-entries="1">Cancel</button>` : ''}
  `;
}

/* ---------------- Screen: Race Capture ---------------- */
function renderRaceCapture(){
  if(state.viewRaceIdx !== null){
    return renderCapturedRaceView(state.viewRaceIdx);
  }
  if(state.draft){
    return renderDraftRace();
  }
  // race list / add race screen
  const raceItems = state.races.map((r,i) => {
    const finishers = r.positions.length;
    const issues = r.dnf.length + r.dns.length + (r.raceRO?1:0);
    return `<div class="race-list-item" data-view-race="${i}">
      <div class="rbadge">R${r.raceNumber}</div>
      <div class="rinfo">
        <div class="rtitle">Race ${r.raceNumber} — captured</div>
        <div class="rsub">${finishers} finisher${finishers===1?'':'s'}${issues?` · ${issues} DNS/DNF/RO`:''}</div>
      </div>
      <div class="chevron">${svgChevR()}</div>
    </div>`;
  }).join('');

  const locked = entriesLocked();
  const toolbar = `<div class="toolbar-row">
    <div class="entries-pill ${locked?'':'editable'}" data-entries-pill="1">
      ${locked ? `🔒 ${state.entries.length} entries locked` : `✎ ${state.entries.length} entries — tap to edit`}
    </div>
    <button class="btn btn-primary btn-sm" data-add-race="1">+ Add Race ${state.races.length+1}</button>
  </div>`;

  return `
    ${toolbar}
    <div class="panel glass panel-pad">
      <div class="section-title">Races</div>
      <div class="section-hint">${state.races.length === 0 ? 'No races captured yet.' : `${state.races.length} race${state.races.length===1?'':'s'} captured.`}</div>
      ${raceItems}
    </div>
  `;
}

function renderDraftRace(){
  const d = state.draft;
  const n = state.entries.length;
  const placed = new Set([...d.positions, ...d.dns, ...d.dnf, d.ro].filter(Boolean));
  const available = currentStandingsOrder().filter(sn => !placed.has(sn));

  const posSlots = [];
  for(let i=0;i<n;i++){
    const sailNo = d.positions[i];
    if(sailNo){
      posSlots.push(`<div class="pos-slot filled" data-clear-position="${i}">
        <div class="pos-num">${i+1}</div>
        <div class="pos-fill"><span class="p-sail">#${sailNo}</span><br><span class="p-name">${escapeHTML(memberFor(sailNo, state.event.class))}</span></div>
      </div>`);
    } else {
      posSlots.push(`<div class="pos-slot"><div class="pos-num">${i+1}</div><div class="pos-fill" style="color:var(--ink-soft)">—</div></div>`);
    }
  }
  // DNS/DNF/RO rows appended below positions
  const codeRows = [];
  d.dns.forEach(sn => codeRows.push(`<div class="pos-code-row" data-clear-code="dns:${sn}"><span class="code-badge">DNS</span><span class="p-sail">#${sn}</span><span style="flex:1;font-size:12px;color:var(--ink-soft)">${escapeHTML(memberFor(sn,state.event.class))}</span></div>`));
  d.dnf.forEach(sn => codeRows.push(`<div class="pos-code-row" data-clear-code="dnf:${sn}"><span class="code-badge">DNF</span><span class="p-sail">#${sn}</span><span style="flex:1;font-size:12px;color:var(--ink-soft)">${escapeHTML(memberFor(sn,state.event.class))}</span></div>`));
  if(d.ro) codeRows.push(`<div class="pos-code-row ro" data-clear-code="ro:${d.ro}"><span class="code-badge">RO</span><span class="p-sail">#${d.ro}</span><span style="flex:1;font-size:12px;color:var(--ink-soft)">${escapeHTML(memberFor(d.ro,state.event.class))}</span></div>`);

  const icons = available.map((sn, idx) => {
    const rank = state.races.length > 0 ? idx+1 : null;
    return `<div class="sail-icon" data-sail-icon="${sn}">
      ${rank ? `<div class="pennant"></div>` : ''}
      <div class="num">#${sn}</div>
      ${rank ? `<div class="rank">#${rank} o/a</div>` : ''}
    </div>`;
  }).join('');

  const allPlaced = available.length === 0;

  return `
    <div class="race-hero">
      <button class="nav-arrow" ${state.races.length ? '' : 'disabled'} data-nav-race="${state.races.length-1}">${svgChevL()}</button>
      <div class="race-hero-title">
        <div class="rnum">Race ${d.raceNumber}</div>
        <div class="rstatus">${allPlaced ? 'All boats placed — ready' : `Capturing… ${placed.size}/${n} placed`}</div>
      </div>
      ${allPlaced
        ? `<button class="nav-arrow action-ready" data-complete-and-next="1" title="Complete &amp; start next race">+</button>`
        : `<button class="nav-arrow" data-cancel-draft="1" title="Cancel">✕</button>`
      }
    </div>
    <div class="race-grid">
      <div class="positions-col">
        <div class="col-label">Finish order</div>
        ${posSlots.join('')}
        ${codeRows.join('')}
      </div>
      <div class="available-col">
        <div class="col-label">Tap to place · hold for DNS/DNF/RO</div>
        <div class="icon-wrap">${icons || `<div class="icon-empty-note">All boats placed — press + to finish.</div>`}</div>
      </div>
    </div>
  `;
}

function renderCapturedRaceView(idx){
  const r = state.races[idx];
  const rows = [];
  r.positions.forEach((sn,i) => rows.push(`<div class="pos-slot filled" data-race-row="${sn}">
      <div class="drag-handle" data-drag-handle="${sn}">${svgDrag()}</div>
      <div class="pos-num">${i+1}</div>
      <div class="pos-fill"><span class="p-sail">#${sn}</span><br><span class="p-name">${escapeHTML(memberFor(sn,state.event.class))}</span></div>
    </div>`));
  r.dns.forEach(sn => rows.push(`<div class="pos-code-row" data-race-row="${sn}"><span class="code-badge">DNS</span><span class="p-sail">#${sn}</span><span style="flex:1;font-size:12px;color:var(--foam-dim)">${escapeHTML(memberFor(sn,state.event.class))}</span></div>`));
  r.dnf.forEach(sn => rows.push(`<div class="pos-code-row" data-race-row="${sn}"><span class="code-badge">DNF</span><span class="p-sail">#${sn}</span><span style="flex:1;font-size:12px;color:var(--foam-dim)">${escapeHTML(memberFor(sn,state.event.class))}</span></div>`));
  if(r.raceRO) rows.push(`<div class="pos-code-row ro" data-race-row="${r.raceRO}"><span class="code-badge">RO</span><span class="p-sail">#${r.raceRO}</span><span style="flex:1;font-size:12px;color:var(--foam-dim)">${escapeHTML(memberFor(r.raceRO,state.event.class))}</span></div>`);

  const canPrev = idx > 0;
  const canNext = idx < state.races.length - 1;
  const nextBtn = canNext
    ? `<button class="nav-arrow" data-nav-race="${idx+1}">${svgChevR()}</button>`
    : state.draft
      ? `<button class="nav-arrow" data-close-view="1" title="Back to current race">${svgChevR()}</button>`
      : `<button class="btn btn-primary btn-sm" data-add-race="1">+ Add Race</button>`;

  return `
    <div class="race-hero">
      <button class="nav-arrow" ${canPrev?'':'disabled'} data-nav-race="${idx-1}">${svgChevL()}</button>
      <div class="race-hero-title">
        <div class="rnum">Race ${r.raceNumber}</div>
        <div class="rstatus">Captured ✓ · drag to reorder · hold to change</div>
      </div>
      ${nextBtn}
    </div>
    <div class="panel glass panel-pad" id="raceViewRows" data-race-idx="${idx}">
      ${rows.join('')}
    </div>
    <button class="btn btn-ghost btn-block" data-close-view="1">Back to races</button>
  `;
}

function renderScoresheet(){
  if(state.races.length === 0) return `<div class="empty-note">No races captured yet.</div>`;
  const n = state.entries.length;
  const rows = state.races.map(r => {
    const cells = [];
    for(let i=0;i<n;i++){
      cells.push(`<td>${r.positions[i] ? '#'+r.positions[i] : ''}</td>`);
    }
    const flags = [
      ...r.dns.map(sn=>`DNS #${sn}`),
      ...r.dnf.map(sn=>`DNF #${sn}`),
      r.raceRO ? `RO #${r.raceRO}` : ''
    ].filter(Boolean).join(' · ');
    return `<tr><td class="name-cell">Race ${r.raceNumber}</td>${cells}<td class="dnf-cell" style="text-align:left">${flags}</td></tr>`;
  }).join('');
  let head = '<th class="name-cell">Race</th>';
  for(let i=1;i<=n;i++) head += `<th>${i}${i===1?'st':i===2?'nd':i===3?'rd':'th'}</th>`;
  head += '<th style="text-align:left">Notes</th>';
  return `<div class="table-scroll"><table class="data-table"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>
  <div class="helper-note">Raw finishing order captured per race. See Race Results for computed standings.</div>`;
}

function renderResultsTable(){
  if(state.races.length === 0) return `<div class="empty-note">No races captured yet.</div>`;
  const standings = computeStandings(state.entries, state.races);
  const raceCount = state.races.length;
  let head = `<th>Pos</th><th class="name-cell">Sail</th><th class="name-cell">Name</th><th>Net</th>`;
  for(let i=1;i<=raceCount;i++) head += `<th>R${i}</th>`;
  head += `<th>Total</th><th>Drop</th>`;

  const rows = standings.map(s => {
    let raceCells = '';
    s.raceScores.forEach(rs => {
      let content = '–';
      let cls = '';
      if(rs.points !== null){
        content = rs.code ? `${rs.points}<sup>${rs.code}</sup>` : String(rs.points);
        if(s.discardSet.has(rs)) cls = 'discarded';
      } else if(rs.code === 'RO'){
        content = 'RO';
      }
      raceCells += `<td class="${cls}">${content}</td>`;
    });
    return `<tr>
      <td>${s.pos}</td>
      <td class="name-cell">#${s.sailNo}</td>
      <td class="name-cell">${escapeHTML(s.member)}</td>
      <td class="net-cell">${s.net}</td>
      ${raceCells}
      <td>${s.total}</td>
      <td>${s.drops}</td>
    </tr>`;
  }).join('');

  return `<div class="table-scroll"><table class="data-table"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>
  <div class="helper-note">Low-point scoring: DNS/DNF score entries+1. RO (race officer) excludes a sailor from that race entirely. Drops: 1 after race 4, 2 after race 8, +1 every 8 races thereafter. Ties broken by countback (most bettered places, then most recent race).</div>`;
}

    <div class="field-label">Race report</div>
    <div class="section-hint" style="margin-bottom:8px">Written separately in the race-report module — paste it in here if you have it, or leave blank and add it later.</div>

/* ============ EVENT HANDLERS ============ */
function openMenu(){ state.menuOpen = true; render(); }
function closeMenu(){ state.menuOpen = false; render(); }

function selectEvent(id){
  const ev = EVENTS.find(e => e.id === id);
  if(!ev) return;
  const regattaName = `${ev.class} ${ev.regattaType}`;
  const full = { id: ev.id, regattaDate: fmtDate(ev.date), date: ev.date, startTime: ev.start, endTime: ev.end,
                 regattaName, className: ev.class, class: ev.class, round: ev.round };
  const saved = loadState(id);
  state.event = full;
  if(saved){
    state.entries = saved.entries || [];
    state.races = saved.races || [];
    state.reportText = saved.reportText || '';
    state.pendingSelection = new Set(state.entries.map(e=>e.sailNo));
  } else {
    state.entries = [];
    state.races = [];
    state.reportText = '';
    state.pendingSelection = new Set();
  }
  state.draft = null;
  state.viewRaceIdx = null;
  state.screen = state.entries.length > 0 ? 'race-capture' : 'select-competitors';
  render();
}

function toggleMember(sailNo){
  if(state.pendingSelection.has(sailNo)) state.pendingSelection.delete(sailNo);
  else state.pendingSelection.add(sailNo);
  render();
}

function selectAllToggle(){
  const roster = MEMBERS.filter(m => m.class === state.event.class);
  const allChecked = roster.length > 0 && roster.every(m => state.pendingSelection.has(m.sailNo));
  if(allChecked) state.pendingSelection.clear();
  else roster.forEach(m => state.pendingSelection.add(m.sailNo));
  render();
}

function confirmEntries(){
  const roster = MEMBERS.filter(m => m.class === state.event.class);
  const isFirstTime = state.entries.length === 0;
  state.entries = roster.filter(m => state.pendingSelection.has(m.sailNo))
                         .map(m => ({ sailNo: m.sailNo, member: m.member }));
  state.screen = 'race-capture';
  saveState();
  showToast(isFirstTime ? 'Entries saved' : 'Entries updated');
  render();
}

function editEntries(){
  // Only permitted before the first race — entries lock automatically once racing starts.
  if(entriesLocked()) return;
  state.pendingSelection = new Set(state.entries.map(e => e.sailNo));
  state.screen = 'select-competitors';
  render();
}

function addRace(){
  state.draft = { raceNumber: state.races.length + 1, positions: [], dns: [], dnf: [], ro: '' };
  state.viewRaceIdx = null;
  render();
}

function cancelDraft(){
  state.draft = null;
  render();
}

function placeSailNo(sailNo){
  const d = state.draft;
  if(!d) return;
  if(d.positions.length >= state.entries.length) return;
  d.positions.push(sailNo);
  render();
}

function clearPosition(idx){
  state.draft.positions.splice(idx,1);
  render();
}

function clearCode(kind, sailNo){
  const d = state.draft;
  if(kind === 'dns') d.dns = d.dns.filter(x=>x!==sailNo);
  else if(kind === 'dnf') d.dnf = d.dnf.filter(x=>x!==sailNo);
  else if(kind === 'ro') d.ro = '';
  render();
}

function setCode(kind){
  const { sailNo: sn, mode, raceIdx } = state.longPressTarget;

  if(mode === 'draft'){
    const d = state.draft;
    if(kind === 'dns') d.dns.push(sn);
    else if(kind === 'dnf') d.dnf.push(sn);
    else if(kind === 'ro') d.ro = sn;
  } else {
    // editing an already-captured race: remove sn from wherever it currently is, then re-place it
    const r = state.races[raceIdx];
    r.positions = r.positions.filter(x => x !== sn);
    r.dns = r.dns.filter(x => x !== sn);
    r.dnf = r.dnf.filter(x => x !== sn);
    if(r.raceRO === sn) r.raceRO = '';
    if(kind === 'dns') r.dns.push(sn);
    else if(kind === 'dnf') r.dnf.push(sn);
    else if(kind === 'finish') r.positions.push(sn);
    saveState();
  }
  state.longPressTarget = null;
  render();
}

function closeLongPressModal(){
  state.longPressTarget = null;
  render();
}

function completeRace(){
  const d = state.draft;
  state.races.push({ raceNumber: d.raceNumber, raceRO: d.ro || '', positions: [...d.positions], dnf: [...d.dnf], dns: [...d.dns] });
  state.draft = null;
  saveState();
}

function completeAndNext(){
  completeRace();
  showToast(`Race ${state.races.length} captured`);
  addRace();
}

function viewRace(idx){
  state.viewRaceIdx = idx;
  render();
}
function navRace(idx){
  state.viewRaceIdx = idx;
  render();
}
function closeRaceView(){
  state.viewRaceIdx = null;
  render();
}


function openOverlay(name){
  if(name === 'entries' && !entriesLocked()){
    state.menuOpen = false;
    editEntries();
    return;
  }
  state.overlay = name;
  state.menuOpen = false;
  render();
}

function cancelEditEntries(){
  state.pendingSelection = new Set(state.entries.map(e=>e.sailNo));
  state.screen = 'race-capture';
  render();
}
function closeOverlay(){
  state.overlay = null;
  render();
}

function saveReportText(){
  const ta = document.getElementById('reportTextArea');
  state.reportText = ta.value;
  saveState();
  showToast('Report text saved');
}

function buildExportObject(){
  const ev = state.event;
  return {
    eventID: ev.id,
    regattaDate: ev.regattaDate,
    startTime: ev.startTime,
    endTime: ev.endTime,
    regattaName: ev.regattaName,
    className: ev.className,
    competitorCount: state.entries.length,
    raceReport: state.reportText || '',
    races: state.races.map(r => ({
      raceNumber: r.raceNumber,
      raceRO: r.raceRO || '',
      positions: r.positions.map(Number),
      dnf: r.dnf.map(Number),
      dns: r.dns.map(Number)
    }))
  };
}

async function downloadJSON(){
  const data = buildExportObject();
  const json = JSON.stringify(data, null, 2);
  const filename = `${state.event.id}-${state.event.regattaDate.replace(/\//g,'-')}.json`;
  try{
    const downloads = window.claude && await window.claude.use ? await window.claude.use('downloads') : null;
    if(downloads){
      await downloads.save({ filename, data: json });
      showToast('Download started');
      return;
    }
  }catch(e){ /* fall through to blob fallback */ }
  try{
    const blob = new Blob([json], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Downloaded');
  }catch(e){
    showToast('Could not download — copy from console');
    console.log(json);
  }
}

function changeEvent(){
  state.menuOpen = false;
  state.screen = 'select-event';
  state.event = null;
  state.overlay = null;
  render();
}

/* ---------------- Long press detection ---------------- */
let pressTimer = null;
let pressFired = false;
const LONG_PRESS_MS = 480;

function bindLongPress(el, sailNo, onShortTap, mode, raceIdx){
  let localPressTimer = null;
  let localFired = false;
  const start = (e) => {
    if(e.target && e.target.closest && e.target.closest('[data-drag-handle]')) return;
    localFired = false;
    localPressTimer = setTimeout(() => {
      localFired = true;
      state.longPressTarget = { sailNo, mode, raceIdx };
      render();
    }, LONG_PRESS_MS);
  };
  const cancel = () => { clearTimeout(localPressTimer); };
  const end = (e) => {
    clearTimeout(localPressTimer);
    if(!localFired && onShortTap){
      onShortTap(sailNo);
    }
  };
  el.addEventListener('touchstart', start, {passive:true});
  el.addEventListener('touchend', end);
  el.addEventListener('touchmove', cancel);
  el.addEventListener('touchcancel', cancel);
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', end);
  el.addEventListener('mouseleave', cancel);
}

/* ---------------- Drag-to-reorder finish positions ---------------- */
function bindDragHandle(handleEl, containerEl, raceIdx){
  handleEl.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const row = handleEl.closest('[data-race-row]');
    if(!row || !row.classList.contains('pos-slot')) return; // only finish-order rows are reorderable
    const positionRows = Array.from(containerEl.querySelectorAll('.pos-slot'));
    const startIndex = positionRows.indexOf(row);
    if(startIndex === -1) return;

    handleEl.setPointerCapture(e.pointerId);
    row.style.position = 'relative';
    row.style.zIndex = '5';
    row.style.boxShadow = '0 8px 20px rgba(2,10,18,0.5)';
    const startY = e.clientY;
    let currentIndex = startIndex;

    const onMove = (ev) => {
      const dy = ev.clientY - startY;
      row.style.transform = `translateY(${dy}px)`;
      // find sibling row we've crossed the midpoint of
      const rows = Array.from(containerEl.querySelectorAll('.pos-slot'));
      const rowRect = row.getBoundingClientRect();
      const rowMidY = rowRect.top + rowRect.height/2;
      rows.forEach((sib, i) => {
        if(sib === row) return;
        const r2 = sib.getBoundingClientRect();
        const sibMid = r2.top + r2.height/2;
        if(i < currentIndex && rowMidY < sibMid){
          containerEl.insertBefore(row, sib);
          currentIndex = i;
          row.style.transform = 'translateY(0px)';
        } else if(i > currentIndex && rowMidY > sibMid){
          containerEl.insertBefore(row, sib.nextSibling);
          currentIndex = i;
          row.style.transform = 'translateY(0px)';
        }
      });
    };

    const onUp = () => {
      handleEl.removeEventListener('pointermove', onMove);
      handleEl.removeEventListener('pointerup', onUp);
      row.style.transform = '';
      row.style.position = '';
      row.style.zIndex = '';
      row.style.boxShadow = '';
      // commit new order back into state from current DOM order
      const newOrder = Array.from(containerEl.querySelectorAll('.pos-slot'))
        .map(el => el.closest('[data-race-row]').getAttribute('data-race-row'));
      if(newOrder.length){
        state.races[raceIdx].positions = newOrder;
        saveState();
        render();
      }
    };

    handleEl.addEventListener('pointermove', onMove);
    handleEl.addEventListener('pointerup', onUp);
  });
}

/* ---------------- Attach handlers after each render ---------------- */
function attachDynamicHandlers(){
  document.querySelectorAll('[data-select-event]').forEach(el=>{
    el.addEventListener('click', ()=> selectEvent(el.getAttribute('data-select-event')));
  });
  const searchInput = document.getElementById('eventSearchInput');
  if(searchInput){
    searchInput.addEventListener('input', (e)=>{ state.eventSearch = e.target.value; render(); setTimeout(()=>{ const i=document.getElementById('eventSearchInput'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length);} },0); });
  }
  document.querySelectorAll('[data-toggle-member]').forEach(el=>{
    el.addEventListener('click', ()=> toggleMember(el.getAttribute('data-toggle-member')));
  });
  document.querySelectorAll('[data-select-all]').forEach(el=> el.addEventListener('click', selectAllToggle));
  document.querySelectorAll('[data-confirm-entries]').forEach(el=> el.addEventListener('click', confirmEntries));
  document.querySelectorAll('[data-cancel-edit-entries]').forEach(el=> el.addEventListener('click', cancelEditEntries));
  document.querySelectorAll('[data-entries-pill]').forEach(el=> el.addEventListener('click', ()=> openOverlay('entries')));
  document.querySelectorAll('[data-add-race]').forEach(el=> el.addEventListener('click', addRace));
  document.querySelectorAll('[data-complete-and-next]').forEach(el=> el.addEventListener('click', completeAndNext));
  document.querySelectorAll('[data-cancel-draft]').forEach(el=> el.addEventListener('click', cancelDraft));
  document.querySelectorAll('[data-clear-position]').forEach(el=>{
    el.addEventListener('click', ()=> clearPosition(Number(el.getAttribute('data-clear-position'))));
  });
  document.querySelectorAll('[data-clear-code]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [kind, sn] = el.getAttribute('data-clear-code').split(':');
      clearCode(kind, sn);
    });
  });
  document.querySelectorAll('[data-sail-icon]').forEach(el=>{
    bindLongPress(el, el.getAttribute('data-sail-icon'), placeSailNo, 'draft', null);
  });
  document.querySelectorAll('[data-view-race]').forEach(el=>{
    el.addEventListener('click', ()=> viewRace(Number(el.getAttribute('data-view-race'))));
  });
  document.querySelectorAll('[data-nav-race]').forEach(el=>{
    el.addEventListener('click', ()=> navRace(Number(el.getAttribute('data-nav-race'))));
  });
  document.querySelectorAll('[data-close-view]').forEach(el=> el.addEventListener('click', closeRaceView));
  const raceRowsContainer = document.getElementById('raceViewRows');
  if(raceRowsContainer){
    const rIdx = Number(raceRowsContainer.getAttribute('data-race-idx'));
    raceRowsContainer.querySelectorAll('[data-race-row]').forEach(el=>{
      bindLongPress(el, el.getAttribute('data-race-row'), null, 'race', rIdx);
    });
    raceRowsContainer.querySelectorAll('[data-drag-handle]').forEach(el=>{
      bindDragHandle(el, raceRowsContainer, rIdx);
    });
  }
  document.querySelectorAll('[data-close-menu]').forEach(el=> el.addEventListener('click', closeMenu));
  document.querySelectorAll('[data-open-overlay]').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(el.classList.contains('disabled')) return;
      openOverlay(el.getAttribute('data-open-overlay'));
    });
  });
  document.querySelectorAll('[data-close-overlay]').forEach(el=> el.addEventListener('click', closeOverlay));
  document.querySelectorAll('[data-save-report]').forEach(el=> el.addEventListener('click', saveReportText));
  document.querySelectorAll('[data-download-json]').forEach(el=> el.addEventListener('click', downloadJSON));
  document.querySelectorAll('[data-new-event]').forEach(el=> el.addEventListener('click', changeEvent));
  document.querySelectorAll('[data-set-code]').forEach(el=>{
    el.addEventListener('click', ()=> setCode(el.getAttribute('data-set-code')));
  });
  document.querySelectorAll('[data-close-modal]').forEach(el=>{
    el.addEventListener('click', (e)=>{ if(e.target === el) closeLongPressModal(); });
  });
}

/* =============Helpers ==========*/
// Helper: Check if date string (YYYY-MM-DD) is today or future
function isFutureOrToday(dateStr) {
  const eventDate = new Date(dateStr);
  const today = new Date();
  today.setHours(0, 0, 0, 0); // Reset time to compare date only
  return eventDate >= today;
}


/* ============ BOOT ============ */
render();

</script>
